# DatabaseInstance — Custom Resource Definition (CRD)
# Teaches the cluster a new API type for our DPaaS learning path.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # MUST equal: <plural>.<group>  →  databaseinstances + . + dpaas.example.com
  name: databaseinstances.dpaas.example.com
spec:
  group: dpaas.example.com
  scope: Namespaced
  names:
    plural: databaseinstances
    singular: databaseinstance
    kind: DatabaseInstance
    shortNames:
      - dbinst
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  enum: ["small", "medium", "large"]
                owner:
                  type: string
              required: ["size", "owner"]
            status:
              type: object
              properties:
                phase:
                  type: string
      # status subresource optional; keep simple for Day 11
