apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpaas-db-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dpaas-db-operator
rules:
  # Watch / update our CRD objects
  - apiGroups: ["dpaas.example.com"]
    resources: ["databaseinstances", "databaseinstances/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Kopf needs these for coordination / events
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dpaas-db-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dpaas-db-operator
subjects:
  - kind: ServiceAccount
    name: dpaas-db-operator
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpaas-db-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpaas-db-operator
  template:
    metadata:
      labels:
        app: dpaas-db-operator
    spec:
      serviceAccountName: dpaas-db-operator
      containers:
        - name: operator
          # Built locally for kind — see README steps (kind load)
          image: dpaas-db-operator:dev
          imagePullPolicy: IfNotPresent
